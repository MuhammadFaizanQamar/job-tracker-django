 
<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker Dashboard</title>
</head>
<body>

    <h1>My Job Applications</h1>

    {% if jobs %}
        <table border="1">
            <tr>
                <th>Company</th>
                <th>Role</th>
                <th>Status</th>
                <th>Date Applied</th>
            </tr>
            {% for job in jobs %}
            <tr>
                <td>{{ job.company }}</td>
                <td>{{ job.role }}</td>
                <td>{{ job.status }}</td>
                <td>{{ job.date_applied }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No job applications yet.</p>
    {% endif %}

</body>
</html>
