{% extends 'jobs/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-body">
                <h3 class="card-title mb-4">Edit Job Application</h3>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success w-100">
                        Update Job
                    </button>
                </form>

                <p class="mt-3 text-center">
                    <a href="{% url 'dashboard' %}">
                        Back to Dashboard
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
